<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>アイドル争奪フェス合戦</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#080611;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

body{
  overflow-x:hidden;
  touch-action:manipulation;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}

#app{
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  overflow:hidden;
}

/* ---------- 共通 ---------- */

.screen{
  display:none;
  min-height:100vh;
  min-height:100dvh;
  padding:
    max(18px,env(safe-area-inset-top))
    max(16px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(16px,env(safe-area-inset-left));
  position:relative;
}

.screen.active{
  display:flex;
  flex-direction:column;
}

.card{
  width:min(720px,100%);
  margin:auto;
  background:rgba(20,15,40,.92);
  border:1px solid rgba(255,255,255,.13);
  border-radius:24px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.title{
  text-align:center;
  font-size:clamp(30px,8vw,58px);
  font-weight:900;
  line-height:1.08;
  margin:0 0 12px;
  letter-spacing:.04em;
}

.subtitle{
  text-align:center;
  color:#cfc8e8;
  margin-bottom:28px;
}

.btn{
  width:100%;
  min-height:58px;
  border:0;
  border-radius:18px;
  color:#fff;
  font-weight:900;
  font-size:18px;
  margin-top:12px;
  background:linear-gradient(135deg,#ff4d9d,#ff8a3d);
  box-shadow:0 8px 25px rgba(255,80,150,.25);
  transition:transform .1s ease,filter .1s ease;
}

.btn:active{
  transform:scale(.97);
  filter:brightness(1.2);
}

.btn.secondary{
  background:linear-gradient(135deg,#4b4b88,#7777bd);
}

.btn.dark{
  background:#29243d;
}

.btn:disabled{
  opacity:.45;
  pointer-events:none;
}

.field{
  margin:16px 0;
}

.field label{
  display:block;
  font-weight:800;
  margin-bottom:8px;
}

.field input,
.field select{
  width:100%;
  min-height:52px;
  padding:10px 14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.16);
  background:#0f0b1d;
  color:#fff;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:#ff67a8;
}

.option-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mode-card{
  padding:16px;
  border:2px solid rgba(255,255,255,.1);
  border-radius:18px;
  background:#110d21;
}

.mode-card.selected{
  border-color:#ff5ca8;
  background:#21102b;
}

.mode-card strong{
  display:block;
  margin-bottom:5px;
}

.mode-card small{
  color:#aaa2c2;
  line-height:1.5;
}

/* ---------- Opening ---------- */

#opening{
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 35%,#5b194f 0,#1c1030 35%,#080611 75%);
}

#opening::before,
#opening::after{
  content:"";
  position:absolute;
  width:180px;
  height:100%;
  top:0;
  opacity:.28;
  filter:blur(12px);
  transform-origin:top center;
  background:linear-gradient(
    180deg,
    rgba(255,255,255,.8),
    rgba(255,105,190,0)
  );
}

#opening::before{
  left:10%;
  transform:rotate(22deg);
}

#opening::after{
  right:10%;
  transform:rotate(-22deg);
}

.opening-inner{
  position:relative;
  z-index:2;
  width:min(700px,100%);
}

.logo{
  font-size:clamp(42px,12vw,82px);
  font-weight:1000;
  line-height:1;
  text-shadow:
    0 0 12px #ff5da8,
    0 0 35px rgba(255,80,170,.7);
  animation:logoIn .8s cubic-bezier(.2,.8,.2,1);
}

.logo span{
  display:block;
  font-size:.42em;
  letter-spacing:.2em;
  margin-top:12px;
  color:#ffe4f1;
}

.start-btn{
  position:relative;
  z-index:10;
  width:min(420px,90%);
  min-height:72px;
  margin:42px auto 0;
  border:0;
  border-radius:999px;
  color:#fff;
  font-size:24px;
  font-weight:1000;
  letter-spacing:.06em;
  background:linear-gradient(135deg,#ff3d94,#ff9c38);
  box-shadow:
    0 0 0 5px rgba(255,255,255,.08),
    0 15px 45px rgba(255,60,150,.35);
  animation:startPulse 1.5s infinite;
}

.start-btn:active{
  transform:scale(.95);
}

.penlights{
  position:absolute;
  inset:auto 0 0;
  height:25%;
  pointer-events:none;
  background:
    radial-gradient(circle at 5% 80%,#ff5da8 0 3px,transparent 4px),
    radial-gradient(circle at 15% 70%,#64dfff 0 3px,transparent 4px),
    radial-gradient(circle at 25% 85%,#fff36d 0 3px,transparent 4px),
    radial-gradient(circle at 40% 75%,#9cff83 0 3px,transparent 4px),
    radial-gradient(circle at 55% 85%,#c27cff 0 3px,transparent 4px),
    radial-gradient(circle at 70% 70%,#ff8c4d 0 3px,transparent 4px),
    radial-gradient(circle at 85% 80%,#64dfff 0 3px,transparent 4px),
    radial-gradient(circle at 95% 72%,#ff5da8 0 3px,transparent 4px);
  opacity:.9;
}

@keyframes logoIn{
  from{
    opacity:0;
    transform:translateY(30px) scale(.85);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes startPulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.035);
  }
}

/* ---------- Setup ---------- */

.setup-list{
  display:grid;
  gap:10px;
}

.player-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.player-number{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#332a50;
  font-weight:900;
  flex:none;
}

.remove-player{
  width:48px;
  min-height:48px;
  border:0;
  border-radius:14px;
  background:#35243c;
  color:#fff;
  font-size:20px;
}

.check{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 0;
  color:#ddd6ec;
}

.check input{
  width:22px;
  height:22px;
}

/* ---------- Order ---------- */

.order-list{
  display:grid;
  gap:10px;
}

.order-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px;
  border-radius:16px;
  background:#120e23;
  border:1px solid rgba(255,255,255,.1);
}

.order-number{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#ff4d9d;
  display:grid;
  place-items:center;
  font-weight:900;
}

/* ---------- Venue ---------- */

.venue-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.venue-card{
  text-align:left;
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:15px;
  color:#fff;
  background:#120e23;
}

.venue-card:active{
  transform:scale(.97);
}

.venue-name{
  font-weight:900;
}

.venue-meta{
  margin-top:5px;
  color:#aaa2c2;
  font-size:13px;
}

.tier{
  margin-top:10px;
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  background:#302544;
  font-size:11px;
  font-weight:900;
}

/* ---------- Play ---------- */

.play-header{
  width:min(1000px,100%);
  margin:0 auto 15px;
}

.play-title{
  font-size:clamp(20px,5vw,32px);
  font-weight:1000;
}

.play-sub{
  color:#aaa2c2;
  margin-top:4px;
}

.timeline{
  width:min(1000px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.slot{
  min-height:105px;
  padding:12px;
  border-radius:18px;
  background:#120e23;
  border:2px dashed rgba(255,255,255,.12);
  position:relative;
}

.slot.empty{
  cursor:pointer;
}

.slot.empty:active{
  transform:scale(.97);
  border-color:#ff5ca8;
}

.slot-index{
  color:#8f87a7;
  font-size:12px;
}

.slot-idol{
  margin-top:10px;
  font-weight:1000;
  line-height:1.25;
  word-break:break-word;
}

.slot.empty .slot-idol{
  color:#5d5672;
}

.action-area{
  width:min(1000px,100%);
  margin:15px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.draw-box{
  width:min(1000px,100%);
  margin:15px auto 0;
  padding:20px;
  text-align:center;
  border-radius:22px;
  background:
    radial-gradient(circle,#42204b,#170f28 70%);
  border:1px solid rgba(255,255,255,.12);
}

.draw-label{
  color:#aaa2c2;
  font-size:13px;
}

.draw-idol{
  margin:12px 0;
  min-height:60px;
  display:grid;
  place-items:center;
  font-size:clamp(24px,7vw,42px);
  font-weight:1000;
  color:#fff;
}

.draw-btn{
  width:100%;
  min-height:58px;
  border:0;
  border-radius:18px;
  color:#fff;
  background:linear-gradient(135deg,#7a45ff,#e04cff);
  font-weight:1000;
  font-size:19px;
}

/* ---------- Modal ---------- */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:#171127;
  border:1px solid rgba(255,255,255,.15);
  border-radius:24px;
  padding:24px;
}

.modal-title{
  font-size:24px;
  font-weight:1000;
  margin-bottom:12px;
}

.modal-text{
  color:#c5bed4;
  line-height:1.6;
}

/* ---------- Roulette ---------- */

.roulette{
  text-align:center;
  padding:20px 0;
}

.roulette-name{
  min-height:90px;
  display:grid;
  place-items:center;
  font-size:clamp(28px,8vw,48px);
  font-weight:1000;
  padding:10px;
}

.sparkle{
  animation:sparkle .65s ease-out;
}

@keyframes sparkle{
  0%{
    transform:scale(.7);
    opacity:.3;
    filter:brightness(1);
  }
  60%{
    transform:scale(1.15);
    opacity:1;
    filter:brightness(1.8);
  }
  100%{
    transform:scale(1);
    filter:brightness(1);
  }
}

/* ---------- Responsive ---------- */

@media(max-width:560px){
  .card{
    padding:18px;
    border-radius:20px;
  }

  .option-row{
    grid-template-columns:1fr;
  }

  .venue-grid{
    grid-template-columns:1fr;
  }

  .timeline{
    grid-template-columns:1fr 1fr;
  }

  .action-area{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- ================= OPENING ================= -->

<section id="opening" class="screen active">
  <div class="opening-inner">
    <div class="logo">
      アイドル争奪<br>フェス合戦
      <span>IDOL BATTLE FESTIVAL</span>
    </div>

    <button
      id="startButton"
      class="start-btn"
      type="button">
      PRESS START 🔥
    </button>
  </div>

  <div class="penlights"></div>
</section>


<!-- ================= SETUP ================= -->

<section id="setup" class="screen">

  <div class="card">

    <h1 class="title">PLAYER SETUP</h1>

    <p class="subtitle">
      プレイヤーとゲームモードを決めよう！
    </p>

    <div class="field">
      <label>ゲームモード</label>

      <div class="option-row">

        <button
          id="modeComplete"
          class="mode-card selected"
          type="button">

          <strong>一人ずつ完成</strong>

          <small>
            1人目がタイムテーブルを完成させてから、
            次のプレイヤーへ。
          </small>

        </button>

        <button
          id="modeAlternate"
          class="mode-card"
          type="button">

          <strong>1枠ずつ交代</strong>

          <small>
            1枠埋めるごとにプレイヤーが交代。
            みんなで競争！
          </small>

        </button>

      </div>
    </div>

    <div class="field">
      <label>プレイヤー</label>

      <div id="playerList" class="setup-list"></div>

      <button
        id="addPlayerButton"
        class="btn secondary"
        type="button">
        ＋ プレイヤー追加
      </button>
    </div>

    <label class="check">
      <input
        id="duplicateProtection"
        type="checkbox"
        checked>
      同じプレイヤーのタイムテーブル内では
      アイドル重複を防ぐ
    </label>

    <button
      id="setupNextButton"
      class="btn"
      type="button">
      次へ →
    </button>

  </div>
</section>


<!-- ================= ORDER ================= -->

<section id="order" class="screen">

  <div class="card">

    <h1 class="title">ORDER</h1>

    <p class="subtitle">
      プレイ順を決定！
    </p>

    <div id="orderList" class="order-list"></div>

    <button
      id="orderNextButton"
      class="btn"
      type="button">
      会場を選ぶ →
    </button>

  </div>
</section>


<!-- ================= VENUE ================= -->

<section id="venue" class="screen">

  <div class="card">

    <h1 class="title">VENUE</h1>

    <p class="subtitle">
      今回のフェス会場を選択！
    </p>

    <div id="venueGrid" class="venue-grid"></div>

  </div>
</section>


<!-- ================= PLAY ================= -->

<section id="play" class="screen">

  <div class="play-header">

    <div id="playTitle" class="play-title">
      PLAYER
    </div>

    <div id="playSub" class="play-sub">
      TIME TABLE
    </div>

  </div>

  <div id="timeline" class="timeline"></div>

  <div class="draw-box">

    <div class="draw-label">
      NEXT IDOL
    </div>

    <div
      id="drawIdol"
      class="draw-idol">
      「抽選」を押してね！
    </div>

    <button
      id="drawButton"
      class="draw-btn"
      type="button">
      🎰 アイドルを抽選！
    </button>

  </div>

  <div class="action-area">

    <button
      id="passButton"
      class="btn secondary"
      type="button">
      パス
    </button>

    <button
      id="homeButton"
      class="btn dark"
      type="button">
      メニュー
    </button>

  </div>

</section>


<!-- ================= RESULT ================= -->

<section id="result" class="screen">

  <div class="card">

    <h1 class="title">FESTIVAL COMPLETE!</h1>

    <p class="subtitle">
      全プレイヤーのタイムテーブルが完成！
    </p>

    <div id="resultContent"></div>

    <button
      id="restartButton"
      class="btn"
      type="button">
      もう一度遊ぶ
    </button>

  </div>
</section>


<!-- ================= MODAL ================= -->

<div id="modal" class="modal">

  <div class="modal-card">

    <div
      id="modalTitle"
      class="modal-title">
    </div>

    <div
      id="modalText"
      class="modal-text">
    </div>

    <div id="modalButtons"></div>

  </div>
</div>

</div>

/* ---------- STATE ---------- */

/* ---------- DOM ---------- */

const $ = id => document.getElementById(id);


/* ---------- SCREEN ---------- */

function showScreen(id){

  document.querySelectorAll(".screen").forEach(screen=>{
    screen.classList.remove("active");
  });

  const target = $(id);

  if(target){
    target.classList.add("active");
  }

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}


/* ---------- SAFE AUDIO ---------- */

let audioContext = null;

function initAudio(){

  try{

    if(!audioContext){

      const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioCtx) return;

      audioContext = new AudioCtx();
    }

    if(audioContext.state === "suspended"){
      audioContext.resume().catch(()=>{});
    }

  }catch(e){
    // 音声はゲーム進行に影響させない
  }
}


function beep(
  frequency=600,
  duration=.08,
  type="sine",
  volume=.035
){

  try{

    initAudio();

    if(!audioContext) return;

    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    osc.type=type;
    osc.frequency.value=frequency;

    gain.gain.setValueAtTime(
      volume,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
      audioContext.currentTime+duration
    );

  }catch(e){}
}

function getTier(slots){

  if(slots>=12){
    return "SUPER FESTIVAL";
  }

  if(slots>=9){
    return "BIG LIVE";
  }

  if(slots>=7){
    return "LIVE HOUSE+";
  }

  return "CLUB STAGE";
}


/* ---------- SELECT VENUE ---------- */

function selectVenue(venue){

  state.venue=venue;

  state.twoPart=
    venue.twoPart &&
    Math.random()<.5;

  state.totalSlots=
    venue.slots*
    (state.twoPart ? 2 : 1);

  state.boards={};

  state.players.forEach(
    player=>{
      state.boards[player]=
        Array(state.totalSlots)
          .fill(null);
    }
  );

  state.usedPool=[];

  state.currentIdol=null;
  state.selectedSlot=null;

  state.currentOrderIndex=0;

  state.passUsed={};

  state.players.forEach(
    player=>{
      state.passUsed[player]=
        getPassCount();
    }
  );

  if(state.twoPart){

    openModal(
      "🌙 TWO PART FESTIVAL",
      `${venue.name}で昼公演＋夜公演！<br><br>
       タイムテーブルは${state.totalSlots}枠になります。`,
      [
        {
          text:"開幕！",
          action:()=>{
            closeModal();
            beginPlay();
          }
        }
      ]
    );

  }else{

    beginPlay();

  }

}


/* ---------- PASS ---------- */

function getPassCount(){

  if(state.totalSlots>=12) return 3;

  if(state.totalSlots>=7) return 2;

  return 1;

}


/* ---------- BEGIN PLAY ---------- */

function beginPlay(){

  state.currentOrderIndex=0;

  renderPlay();

  showScreen("play");

}


/* ---------- CURRENT PLAYER ---------- */

function currentPlayer(){

  return state.order[
    state.currentOrderIndex

}


/* ---------- PLAY RENDER ---------- */

function renderPlay(){

  const player=
    currentPlayer();

  $("playTitle").textContent=
    `${player} のタイムテーブル`;

  const venueText=
    state.venue
      ? `${state.venue.name} / ${getTier(state.venue.slots)}`
      : "";

  $("playSub").textContent=
    `${venueText}　${filledCount(player)}/${state.totalSlots}枠`;

  renderTimeline();

  $("drawIdol").textContent=
    state.currentIdol ||
    "「抽選」を押してね！";

}


/* ---------- TIMELINE ---------- */

function renderTimeline(){

  const timeline=$("timeline");

  timeline.innerHTML="";

  const board=
    state.boards[currentPlayer()];

  board.forEach(
    (idol,index)=>{

      const slot=
        document.createElement("button");

      slot.type="button";
      slot.className=
        "slot "+
        (idol ? "" : "empty");

      const label=
        document.createElement("div");

      label.className="slot-index";

      if(state.twoPart){

        const half=
          index <
          state.venue.slots
            ? "DAY"
            : "NIGHT";

        label.textContent=
          `${half} ${index % state.venue.slots + 1}`;

      }else{

        label.textContent=
          `#${index+1}`;

      }

      const name=
        document.createElement("div");

      name.className="slot-idol";

      name.textContent=
        idol || "空き枠";

      slot.append(
        label,
        name
      );

      if(!idol){

        slot.addEventListener(
          "click",
          ()=>{

            if(!state.currentIdol){

              openModal(
                "まずアイドルを抽選！",
                "先に「アイドルを抽選！」を押してください。"
              );

              return;
            }

            placeCurrentIdol(index);

          }
        );

      }

      timeline.appendChild(slot);

    }
  );

}


/* ---------- FILLED COUNT ---------- */

function filledCount(player){

  return state.boards[player]
    .filter(Boolean)
    .length;

}


/* ---------- DRAW ---------- */

$("drawButton").addEventListener(
  "click",
  drawIdol
);


function drawIdol(){

  if(state.drawing){
    return;
  }

  if(
    filledCount(currentPlayer())
    >=state.totalSlots
  ){
    return;
  }

  state.drawing=true;

  const candidates=
    getCandidates();

  if(candidates.length===0){

    state.drawing=false;

    encore();

    return;

  }

  let index=0;
  let elapsed=0;

  const display=$("drawIdol");

  const interval=
    setInterval(
      ()=>{

        const idol=
          candidates[
            index%candidates.length
          ];

        display.textContent=idol;

        index++;

        elapsed+=80;

        if(elapsed>=1100){

          clearInterval(interval);

          const finalIdol=
            candidates[
              Math.floor(
                Math.random()*
                candidates.length
              )
            ];

          state.currentIdol=
            finalIdol;

          display.textContent=
            finalIdol;

          display.classList.remove(
            "sparkle"
          );

          void display.offsetWidth;

          display.classList.add(
            "sparkle"
          );

          successSound();

          state.drawing=false;

        }

      },
      80
    );

}


/* ---------- CANDIDATES ---------- */

function getCandidates(){

  const board=
    state.boards[currentPlayer()];

  let candidates=
    IDOLS.filter(
      idol=>!state.usedPool.includes(idol)
    );

  if(
    state.duplicateProtection
  ){

    const active=
      new Set(
        board.filter(Boolean)
      );

    candidates=
      candidates.filter(
        idol=>!active.has(idol)
      );

  }

  return candidates;

}


/* ---------- PLACE ---------- */

function placeCurrentIdol(index){

  if(!state.currentIdol){
    return;
  }

  const player=
    currentPlayer();

  const board=
    state.boards[player];

  if(board[index]){
    return;
  }

  const idol=
    state.currentIdol;

  board[index]=idol;

  if(!state.usedPool.includes(idol)){
    state.usedPool.push(idol);
  }

  state.currentIdol=null;
  state.selectedSlot=null;

  successSound();

  renderPlay();

  if(
    filledCount(player)
    >=state.totalSlots
  ){

    completeCurrentPlayer();

    return;

  }

  if(state.mode==="alternate"){

    advanceTurn();

  }

}


/* ---------- COMPLETE PLAYER ---------- */

function completeCurrentPlayer(){

  finalSound();

  const player=
    currentPlayer();

  const isLast=
    state.currentOrderIndex
    >=state.order.length-1;

  if(isLast){

    setTimeout(
      showResult,
      500
    );

    return;

  }

  if(state.mode==="complete"){

    state.currentOrderIndex++;

  }else{

    state.currentOrderIndex++;

  }

  setTimeout(
    ()=>{
      renderPlay();
    },
    400
  );

}


/* ---------- ADVANCE TURN ---------- */

function advanceTurn(){

  state.currentOrderIndex=
    (
      state.currentOrderIndex+1
    )%state.order.length;

  renderPlay();

}


/* ---------- ENCORE ---------- */

function encore(){

  const activeBoard=
    state.boards[currentPlayer()];

  let candidates=
    IDOLS.filter(
      idol=>{
        if(
          state.duplicateProtection &&
          activeBoard.includes(idol)
        ){
          return false;
        }

        return true;
      }
    );

  if(candidates.length===0){

    candidates=
      [...IDOLS];

  }

  state.currentIdol=
    candidates[
      Math.floor(
        Math.random()*
        candidates.length
      )
    ];

  $("drawIdol").textContent=
    `ENCORE! ${state.currentIdol}`;

  $("drawIdol").classList.add(
    "sparkle"
  );

  successSound();

  state.drawing=false;

}


/* ---------- PASS ---------- */

$("passButton").addEventListener(
  "click",
  ()=>{

    const player=
      currentPlayer();

    if(state.passUsed[player]<=0){

      openModal(
        "パスできません",
        "このプレイヤーのパス回数を使い切っています。"
      );

      return;

    }

    state.passUsed[player]--;

    state.currentIdol=null;

    $("drawIdol").textContent=
      "パスしました！";

    if(state.mode==="alternate"){

      advanceTurn();

    }

  }
);


/* ---------- RESULT ---------- */

function showResult(){

  showScreen("result");

  const container=
    $("resultContent");

  container.innerHTML="";

  state.order.forEach(
    player=>{

      const section=
        document.createElement("div");

      section.style.marginBottom="24px";

      const heading=
        document.createElement("h2");

      heading.textContent=player;

      heading.style.marginBottom="10px";

      section.appendChild(heading);

      state.boards[player].forEach(
        (idol,index)=>{

          const row=
            document.createElement("div");

          row.style.padding="10px 12px";
          row.style.marginBottom="5px";
          row.style.borderRadius="10px";
          row.style.background="#120e23";

          const part=
            state.twoPart
              ? (
                  index<state.venue.slots
                    ? "DAY"
                    : "NIGHT"
                )
              : "";

          row.textContent=
            `${part ? part+" " : ""}#${index+1}　${idol}`;

          section.appendChild(row);

        }
      );

      container.appendChild(section);

    }
  );

}


/* ---------- RESTART ---------- */

$("restartButton").addEventListener(
  "click",
  ()=>{
    location.reload();
  }
);


/* ---------- MODAL ---------- */

function openModal(
  title,
  text,
  buttons=[]
){

  $("modalTitle").textContent=
    title;

  $("modalText").innerHTML=
    text;

  const container=
    $("modalButtons");

  container.innerHTML="";

  if(buttons.length===0){

    const button=

    button.type="button";
    button.className="btn";
    button.textContent="OK";

    button.addEventListener(
      "click",
      closeModal
    );

    container.appendChild(button);

  }else{

    buttons.forEach(
      data=>{

        const button=
          document.createElement("button");

        button.type="button";
        button.className="btn";
        button.textContent=data.text;

        button.addEventListener(
          "click",
          data.action
        );

        container.appendChild(button);

      }
    );

  }

  $("modal").classList.add("show");

}


function closeModal(){

  $("modal").classList.remove(
    "show"
  );

}


/* ---------- SHUFFLE ---------- */

function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [
      array[i],
      array[j]
    ]=[
      array[j],
      array[i]
    ];

  }

  return array;

}


/* ---------- INITIALIZE ---------- */

renderPlayerSetup();

</script>

/* =========================================================

function ensureAudio(){

  try{

    if(!audioCtx){
      audioCtx = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
    }

    if(audioCtx.state === "suspended"){
      audioCtx.resume().catch(()=>{});
    }

  }catch(e){
    audioCtx = null;
  }
}

function playTone(freq=440, duration=0.08, type="sine", volume=0.045){

  try{

    ensureAudio();

    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq,audioCtx.currentTime);

    gain.gain.setValueAtTime(0.0001,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      volume,
      audioCtx.currentTime+0.008
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+duration+0.02);

  }catch(e){}
}

/* =========================================================
   PARTICLES
   ========================================================= */

function burstParticles(count=35){

  const canvas = $("fx-canvas");

  if(!canvas) return;

  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  particles = [];

  for(let i=0;i<count;i++){

    particles.push({
      x:window.innerWidth/2,
      y:window.innerHeight*0.4,

      vx:(Math.random()-0.5)*11,
      vy:(Math.random()-0.75)*11,

      size:2+Math.random()*5,
      life:45+Math.random()*45
    });
  }

  if(particleAnimation){
    cancelAnimationFrame(particleAnimation);
  }

  function draw(){

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    let alive=false;

    particles.forEach(p=>{

      if(p.life<=0) return;

      alive=true;

      p.x+=p.vx;
      p.y+=p.vy;
      p.vy+=0.18;
      p.life--;

      ctx.globalAlpha=Math.max(0,p.life/80);

      ctx.beginPath();
      ctx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI*2
      );

      ctx.fill();
    });

    ctx.globalAlpha=1;

    if(alive){
      particleAnimation=requestAnimationFrame(draw);
    }else{
      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );
    }
  }

  draw();
}

  if(slots>=9) return "BIG LIVE";
  if(slots>=7) return "LIVE HOUSE+";
  return "CLUB STAGE";

function rouletteVenue(){

  const display=$("venueRoulette");

  if(!display) return;

  let count=0;
  const max=22;

  const timer=setInterval(()=>{

    const venue=randomItem(VENUES);

    display.textContent=venue.name;

    soundRoulette();

    count++;

    if(count>=max){

      const selected=randomItem(VENUES);

      selectedVenue=selected;

      display.textContent=selected.name;

      setTimeout(()=>{
        revealVenue(selected);
      },300);

  },70);

/* =========================================================
   GAME INITIALIZATION
   ========================================================= */

function initializeGame(){

  /*
   * 各プレイヤーのボードを初期化
   */
  players.forEach(player=>{
    player.board=Array(totalSlots).fill(null);
  });

  playerPassStatus={};

  players.forEach((_,index)=>{
    playerPassStatus[index]=getPassCount();
  });

  /*
   * 個人完成モードではプレイヤー変更時に
   * プールリセットが選択されている場合がある。
   *
   * 交代モードでは共有プール固定。
   */
  availableIdols=[...IDOLS];
  usedIdols=[];

  currentTurnIndex=0;

  if(gameMode==="individual"){
    prepareIndividualPlayer(turnOrder[0]);
  }
}

function getCurrentPlayerIndex(){
  return turnOrder[currentTurnIndex];
}

function getCurrentPlayer(){

  const index=getCurrentPlayerIndex();

  return players[index];
}

function getPassCount(){

  if(totalSlots>=12) return 3;
  if(totalSlots>=7) return 2;

  return 1;
}

function prepareIndividualPlayer(playerIndex){

  if(resetMode==="reset"){
    availableIdols=[...IDOLS];
    usedIdols=[];
  }

  playerPassStatus[playerIndex]=getPassCount();
}


/* =========================================================
   DRAW / ENCORE
   ========================================================= */

function getEligibleIdols(){

  const player=getCurrentPlayer();

  if(!player) return [];

  /*
   * 通常プール
   */
  let candidates=availableIdols.filter(idol=>{
    if(!player.board.includes(idol)) return true;
    return false;
  });

  /*
   * 重複防止をOFFにしている場合
   */
  const duplicateProtection =
    $("duplicateProtection")?.checked ?? true;

  if(!duplicateProtection){
    candidates=[...availableIdols];
  }

  /*
   * 通常プールが空ならアンコール。
   * 既に使用したアイドルを復活させる。
   */
  if(candidates.length===0){

    let encore=usedIdols.filter(idol=>{
      return !player.board.includes(idol);
    });

    if(encore.length===0){
      encore=[...usedIdols];
    }

    return encore;
  }

  return candidates;
}

function drawIdol(){

  ensureAudio();

  const emptySlotIndex=
    getCurrentPlayer().board.findIndex(v=>v===null);

  if(emptySlotIndex===-1){
    return;
  }

  pendingSlotIndex=emptySlotIndex;

  const candidates=getEligibleIdols();

  if(candidates.length===0){
    alert("選べるアイドルがありません。");
    return;
  }

  const display=$("idolRoulette");

  if(!display) return;

  let count=0;

  const max=28;

  const timer=setInterval(()=>{

    display.textContent=randomItem(candidates);

    soundRoulette();

    count++;

    if(count>=max){

      clearInterval(timer);

      const idol=randomItem(candidates);

      currentDrawnIdol=idol;

      display.textContent=idol;

      soundReveal();

      burstParticles(30);

      showPlacementPrompt();

    }

  },55);
}


/* =========================================================
   PLACEMENT
   ========================================================= */

function showPlacementPrompt(){

  const player=getCurrentPlayer();

  const text=$("drawnIdol");

  if(text){
    text.textContent=currentDrawnIdol || "—";
  }

  renderGame();

  /*
   * 空き枠をタップして配置
   */
}

function chooseSlot(index){

  if(currentDrawnIdol===null){
    return;
  }

  const player=getCurrentPlayer();

  if(!player || player.board[index]!==null){
    return;
  }

  pendingSlotIndex=index;

  ensureAudio();
  soundClick();

  const modal=$("placementConfirm");

  if(modal){

    const idol=$("placementIdol");

    if(idol){
      idol.textContent=currentDrawnIdol;
    }

    modal.classList.add("active");

  }else{

    if(confirm(
      `${currentDrawnIdol}を${index+1}枠目に配置しますか？`
    )){
      confirmPlacement();
    }
  }
}

function cancelPlacement(){

  const modal=$("placementConfirm");

  if(modal){
    modal.classList.remove("active");
  }

  pendingSlotIndex=null;

  soundClick();
}

function confirmPlacement(){

  const modal=$("placementConfirm");

  if(modal){
    modal.classList.remove("active");
  }

  if(currentDrawnIdol===null || pendingSlotIndex===null){
    return;
  }

  const player=getCurrentPlayer();

  if(!player){
    return;
  }

  const index=pendingSlotIndex;

  if(player.board[index]!==null){
    return;
  }

  /*
   * 実際に配置された時点でプールから削除
   */
  const poolIndex=availableIdols.indexOf(currentDrawnIdol);

  if(poolIndex!==-1){
    availableIdols.splice(poolIndex,1);
  }

  if(!usedIdols.includes(currentDrawnIdol)){
    usedIdols.push(currentDrawnIdol);
  }

  player.board[index]=currentDrawnIdol;

  soundPlace();
  burstParticles(22);

  currentDrawnIdol=null;
  pendingSlotIndex=null;

  renderGame();

  if(isPlayerComplete(player)){

    setTimeout(()=>{
      playerCompleted();
    },550);

    return;
  }

  /*
   * 1枠ずつ交代モードなら次のプレイヤーへ
   */
  if(gameMode==="alternate"){

    setTimeout(()=>{
      advanceTurn();
    },450);

  }else{

    /*
     * 一人ずつ完成モードでは同じプレイヤーが続行
     */
    setTimeout(()=>{
      renderGame();
    },300);
  }
}


/* =========================================================
   PASS
   ========================================================= */

function passTurn(){

  ensureAudio();

  const playerIndex=getCurrentPlayerIndex();

  if(playerPassStatus[playerIndex]<=0){

    alert("パスを使い切っています。");
    return;
  }

  const modal=$("passConfirm");

  if(modal){
    modal.classList.add("active");
  }else{

    if(confirm("このターンをパスしますか？")){
      confirmPass();
    }
  }
}

function cancelPass(){

  const modal=$("passConfirm");

  if(modal){
    modal.classList.remove("active");
  }

  soundClick();
}

function confirmPass(){

  const modal=$("passConfirm");

  if(modal){
    modal.classList.remove("active");
  }

  const playerIndex=getCurrentPlayerIndex();

  if(playerPassStatus[playerIndex]<=0){
    return;
  }

  playerPassStatus[playerIndex]--;

  soundPass();

  currentDrawnIdol=null;
  pendingSlotIndex=null;

  if(gameMode==="alternate"){

    advanceTurn();

  }else{

    renderGame();
  }
}


/* =========================================================
   TURN CONTROL
   ========================================================= */

function advanceTurn(){

  currentTurnIndex++;

  /*
   * 1周終了
   */
  if(currentTurnIndex>=turnOrder.length){
    currentTurnIndex=0;
  }

  const playerIndex=getCurrentPlayerIndex();

  /*
   * 個人完成モードでプレイヤーが変わった時
   */
  if(gameMode==="individual"){
    prepareIndividualPlayer(playerIndex);
  }

  renderGame();

  /*
   * 直前に配置済みなら少し間を置いて
   * 次のプレイヤーを見せる
   */
  burstParticles(12);
}

function playerCompleted(){

  soundComplete();
  burstParticles(70);

  const player=getCurrentPlayer();

  const completedModal=$("completeModal");

  if(completedModal){

    const name=completedModal.querySelector(".completed-player");

    if(name){
      name.textContent=player.name;
    }

    completedModal.classList.add("active");

  }else{

    alert(`${player.name}のタイムテーブル完成！`);

    continueAfterCompletion();
  }
}

function continueAfterCompletion(){

  const modal=$("completeModal");

  if(modal){
    modal.classList.remove("active");
  }

  /*
   * 全員完成なら結果画面
   */
  if(players.every(player=>isPlayerComplete(player))){

    setTimeout(()=>{
      showResult();
    },350);

    return;
  }

  /*
   * 一人ずつ完成
   */
  if(gameMode==="individual"){

    currentTurnIndex++;

    if(currentTurnIndex>=turnOrder.length){
      currentTurnIndex=0;
    }

    const nextPlayer=getCurrentPlayerIndex();

    prepareIndividualPlayer(nextPlayer);

    currentDrawnIdol=null;
    pendingSlotIndex=null;

    renderGame();

    return;
  }

  /*
   * 交代モード
   *
   * 完成した人はスキップして、
   * 未完成プレイヤーへ。
   */
  findNextIncompletePlayer();
}

function findNextIncompletePlayer(){

  for(let i=0;i<turnOrder.length;i++){

    currentTurnIndex++;

    if(currentTurnIndex>=turnOrder.length){
      currentTurnIndex=0;
    }

    const player=getCurrentPlayer();

    if(player && !isPlayerComplete(player)){

      renderGame();
      return;
    }
  }

  showResult();
}

function isPlayerComplete(player){

  return player.board.every(slot=>slot!==null);
}


/* =========================================================
   GAME RENDER
   ========================================================= */

function renderGame(){

  const player=getCurrentPlayer();

  if(!player) return;

  const nameEl=$("currentPlayerName");

  if(nameEl){
    nameEl.textContent=player.name;
  }

  const turnEl=$("turnInfo");

  if(turnEl){

    turnEl.textContent=
      `${currentTurnIndex+1} / ${turnOrder.length}`;
  }

  const slotEl=$("slotCount");

  if(slotEl){
    slotEl.textContent=totalSlots;
  }

  const passEl=$("passCount");

  if(passEl){
    passEl.textContent=
      playerPassStatus[getCurrentPlayerIndex()] ?? 0;
  }

  const board=$("timetable");

  if(!board) return;

  board.innerHTML="";

  player.board.forEach((idol,index)=>{

    const slot=document.createElement("button");

    slot.type="button";
    slot.className="timetable-slot";

    if(idol){
      slot.classList.add("filled");

      slot.textContent=idol;

    }else{

      slot.classList.add("empty");

      slot.innerHTML=`
        <span class="slot-number">${index+1}</span>
        <span>空き</span>
      `;

      slot.addEventListener("click",()=>{
        chooseSlot(index);
      });
    }

    board.appendChild(slot);
  });

  const drawButton=$("drawButton");

  if(drawButton){

    const hasEmpty=player.board.some(v=>v===null);

    drawButton.disabled=
      !hasEmpty ||
      currentDrawnIdol!==null;
  }

  const passButton=$("passButton");

  if(passButton){

    passButton.disabled=
      (playerPassStatus[getCurrentPlayerIndex()] ?? 0)<=0;
  }

  const modeEl=$("currentMode");

  if(modeEl){

    modeEl.textContent=
      gameMode==="individual"
      ? "一人ずつ完成"
      : "1枠ずつ交代";
  }

  const tier=$("stageTier");

  if(tier){
    tier.textContent=getVenueTier(totalSlots);
  }

  const venue=$("currentVenue");

  if(venue && selectedVenue){
    venue.textContent=selectedVenue.name;
  }
}


/* =========================================================
   RESULT
   ========================================================= */

  burstParticles(120);

  if(!result) return;

  result.innerHTML="";

  turnOrder.forEach((playerIndex,index)=>{

}

    restartButton.addEventListener(
      "click",
      restartGame
    );
  }

});


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener("resize",()=>{

  const canvas=$("fx-canvas");

  if(canvas){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
  }
});


/* =========================================================
   iPhone SAFETY
   ========================================================= */

window.addEventListener("pageshow",()=>{
  /*
   * SafariのBFCache復帰時に状態が壊れにくくする
   */
  try{
    if(audioCtx && audioCtx.state==="suspended"){
      audioCtx.resume().catch(()=>{});
    }
  }catch(e){}
});

window.startGame=startGame;

window.cancelPlacement=cancelPlacement;

window.passTurn=passTurn;

window.advanceTurn=advanceTurn;
window.continueAfterCompletion=continueAfterCompletion;

window.backHome=backHome;

/* =========================================================
   INITIAL
   ========================================================= */

(function initialSetup(){

  const canvas=$("fx-canvas");

  if(canvas){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
  }

  /*
   * START画面を表示
   */
  qsa(".screen").forEach((screen,index)=>{
    if(index===0){
      screen.classList.add("active");
    }
  });

})();
