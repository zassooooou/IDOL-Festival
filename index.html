<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイドル争奪フェス合戦 〜きみに決めた！〜</title>
  <style>
    :root {
      --primary: #ff2a75;
      --secondary: #00f0ff;
      --accent: #ffe600;
      --bg-dark: #0a0a16;
      --card-bg: rgba(255, 255, 255, 0.07);
      --text-light: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "メイリオ", meiryo;
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 背景キャンバス（エフェクト用） */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* ミュートボタン */
    .mute-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid var(--secondary);
      color: var(--secondary);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      transition: all 0.2s;
    }
    .mute-btn:hover {
      background: var(--secondary);
      color: #000;
    }

    /* コンテナ */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 画面切り替え */
    .screen {
      display: none;
      width: 100%;
      animation: fadeIn 0.5s ease-in-out;
    }
    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 共通ボタン */
    .btn {
      background: linear-gradient(45deg, var(--primary), #ff6000);
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 42, 117, 0.5);
      transition: all 0.2s;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      margin: 10px 0;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 42, 117, 0.8);
    }
    .btn-secondary {
      background: linear-gradient(45deg, #0088ff, var(--secondary));
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
      color: #000;
    }
    .btn-secondary:hover {
      box-shadow: 0 6px 20px rgba(0, 240, 255, 0.7);
    }

    /* 1. オープニング画面 */
    #op-screen {
      text-align: center;
      padding-top: 60px;
    }
    .op-title {
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255, 42, 117, 0.6);
      margin-bottom: 10px;
      letter-spacing: 2px;
      animation: titlePulse 2s infinite alternate;
    }
    @keyframes titlePulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255,42,117,0.8)); }
      100% { transform: scale(1.03); filter: drop-shadow(0 0 35px rgba(0,240,255,0.9)); }
    }
    .op-subtitle {
      font-size: 1.3rem;
      color: var(--secondary);
      margin-bottom: 40px;
      letter-spacing: 1px;
    }
    .start-btn-wrap {
      margin-top: 30px;
    }

    /* 2. ルール＆事前設定画面 */
    .config-card {
      background: rgba(20, 20, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .config-card h2 {
      font-size: 1.4rem;
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
      padding-bottom: 8px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .setting-group {
      margin-bottom: 18px;
    }
    .setting-label {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
      color: #ddd;
    }
    .radio-group, .checkbox-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    .radio-label, .checkbox-label {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .radio-label:hover, .checkbox-label:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    input[type="radio"]:checked + span, input[type="checkbox"]:checked + span {
      color: var(--secondary);
      font-weight: bold;
    }

    /* アイドル管理リスト */
    .idol-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .idol-chip {
      background: linear-gradient(135deg, rgba(255,42,117,0.3), rgba(0,240,255,0.3));
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .idol-chip .del-btn {
      color: #ff4d4d;
      cursor: pointer;
      font-weight: bold;
    }
    .add-idol-form {
      display: flex;
      gap: 8px;
    }
    .add-idol-form input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
    }

    /* 3. ゲームメイン画面 */
    .game-status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.6);
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .current-turn-box {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent);
    }

    /* スロット演出エリア */
    .slot-display-container {
      width: 100%;
      height: 140px;
      background: radial-gradient(circle, #1a1a3a 0%, #080812 100%);
      border: 3px solid var(--secondary);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .slot-text {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px var(--secondary);
      text-align: center;
      padding: 0 10px;
    }
    .slot-text.spinning {
      filter: blur(2px);
      transform: scale(0.95);
    }

    /* タイムテーブル表示エリア */
    .timetables-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
    }
    @media (max-width: 600px) {
      .timetables-grid { grid-template-columns: 1fr; }
    }

    .tt-board {
      background: rgba(15, 15, 30, 0.8);
      border-radius: 12px;
      padding: 15px;
      border: 2px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    .tt-board.active-player {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(255, 42, 117, 0.4);
    }
    .tt-board h3 {
      text-align: center;
      color: var(--secondary);
      margin-bottom: 12px;
      font-size: 1.2rem;
    }
    .slot-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slot-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 45px;
    }
    .slot-item.filled {
      background: linear-gradient(90deg, rgba(255,42,117,0.2), rgba(0,0,0,0.4));
      border: 1px solid var(--primary);
    }
    .slot-time {
      font-size: 0.85rem;
      color: #aaa;
    }
    .slot-idol {
      font-weight: bold;
      color: #fff;
    }

    /* 4. リザルト画面 */
    .result-box {
      width: 100%;
      background: rgba(20, 20, 35, 0.9);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--accent);
    }
    .result-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- 背景エフェクトキャンバス -->
  <canvas id="bgCanvas"></canvas>

  <!-- サウンド切り替え -->
  <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊 SOUND: ON</button>

  <div class="container">

    <!-- 1. オープニング画面 -->
    <div id="op-screen" class="screen active">
      <div class="op-title">アイドル争奪フェス合戦</div>
      <div class="op-subtitle">〜きみに決めた！〜</div>
      <p style="color: #ccc; margin-bottom: 20px;">最高のタイムテーブルを組み立てろ！</p>
      <div class="start-btn-wrap">
        <button class="btn" onclick="goToConfig()">GAME START</button>
      </div>
    </div>

    <!-- 2. ルール・設定画面 (1画面に統合) -->
    <div id="config-screen" class="screen">
      <h1 style="margin-bottom: 20px; color: var(--accent);">ゲーム設定 & ルール</h1>

      <!-- モード選択 -->
      <div class="config-card">
        <h2>🎮 進行モード選択</h2>
        <div class="setting-group">
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="gameMode" value="turn" checked>
              <span>1組ずつ交互に交代 (ターン制)</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="gameMode" value="solo-first">
              <span>プレイヤー1が全枠完成 → プレイヤー2へ (連続制)</span>
            </label>
          </div>
        </div>
      </div>

      <!-- 特殊ルール選択 -->
      <div class="config-card">
        <h2>📜 特殊ルール</h2>
        <div class="setting-group">
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="ruleNoDuplicate" checked>
              <span>同じアイドルの重複出現を禁止する</span>
            </label>
          </div>
        </div>
      </div>

      <!-- アイドルプール編集 -->
      <div class="config-card">
        <h2>🎤 出演アイドル候補（プール）</h2>
        <div class="idol-list" id="idolChipContainer"></div>
        <div class="add-idol-form">
          <input type="text" id="newIdolInput" placeholder="新しいアイドル名を入力...">
          <button class="btn btn-secondary" style="padding: 8px 16px; font-size:0.9rem;" onclick="addIdol()">追加</button>
        </div>
      </div>

      <button class="btn" onclick="startGame()">対戦スタート！</button>
    </div>

    <!-- 3. ゲームメイン画面 -->
    <div id="game-screen" class="screen">
      <div class="game-status-bar">
        <div class="current-turn-box" id="turnIndicator">プレイヤー1の番</div>
        <div id="slotProgress" style="color: #aaa; font-size: 0.9rem;">残り枠: 10</div>
      </div>

      <!-- ドラムスロット表示 -->
      <div class="slot-display-container">
        <div class="slot-text" id="slotDisplay">PRESS START!</div>
      </div>

      <div style="text-align: center; margin-bottom: 20px;">
        <button class="btn" id="spinBtn" onclick="spinSlot()">スロットを回す！</button>
      </div>

      <!-- 両者のタイムテーブル -->
      <div class="timetables-grid">
        <div class="tt-board active-player" id="boardP1">
          <h3>PLAYER 1</h3>
          <div class="slot-list" id="listP1"></div>
        </div>
        <div class="tt-board" id="boardP2">
          <h3>PLAYER 2</h3>
          <div class="slot-list" id="listP2"></div>
        </div>
      </div>
    </div>

    <!-- 4. リザルト画面 -->
    <div id="result-screen" class="screen">
      <h1 style="color: var(--accent); margin-bottom: 10px;">フェスフェスタイムテーブル完成！</h1>
      <p style="margin-bottom: 20px; color: #ccc;">両プレイヤーの対戦タイムテーブルが完成しました。</p>

      <div class="result-box" id="resultContent">
        <div class="timetables-grid" id="resultGrid"></div>
      </div>

      <div class="result-actions">
        <button class="btn btn-secondary" onclick="copyResultText()">📋 テキストでコピー</button>
        <button class="btn btn-secondary" onclick="downloadResultImage()">🖼️ 画像で保存</button>
        <button class="btn" onclick="goToConfig()">もう一度遊ぶ</button>
      </div>
    </div>

  </div>

  <script>
    // --- 初期データ ---
    let defaultIdols = [
      "Colorful Scream", "W.", "Nounai Pastel", "North Sound", 
      "Arashi", "Hanshin Tigers Idol", "未来少女ゼノン", "夜空のスターライト", 
      "シャイニングブレイド", "チェリーパイ", "ネオンサーカス", "夢色メロディ"
    ];
    let idolPool = [...defaultIdols];

    const timeSlots = [
      "12:00 (OP)", "13:00 (昼部1)", "14:00 (昼部2)", "15:00 (昼部トリ)",
      "17:00 (夜部OP)", "18:00 (夜部1)", "19:00 (夜部2)", "20:00 (メイントリ)"
    ];

    // ゲーム状態
    let gameState = {
      mode: 'turn', // 'turn' or 'solo-first'
      noDuplicate: true,
      p1Slots: Array(timeSlots.length).fill(null),
      p2Slots: Array(timeSlots.length).fill(null),
      currentPlayer: 1, // 1 or 2
      currentIndexP1: 0,
      currentIndexP2: 0,
      isSpinning: false,
      isMuted: false
    };

    // --- Web Audio API (効果音) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }

    function playSound(type) {
      if (gameState.isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'spin') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'stop') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'start') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    function toggleMute() {
      gameState.isMuted = !gameState.isMuted;
      document.getElementById('muteBtn').innerText = gameState.isMuted ? "🔇 SOUND: OFF" : "🔊 SOUND: ON";
    }

    // --- 背景Canvas演出（パーティクル） ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.speedY = (Math.random() - 0.5) * 1.5;
        this.color = Math.random() > 0.5 ? '#ff2a75' : '#00f0ff';
        this.alpha = Math.random() * 0.6 + 0.2;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 60; i++) particles.push(new Particle());

    function animateBg() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateBg);
    }
    animateBg();

    // --- 画面遷移コントロール ---
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function goToConfig() {
      playSound('start');
      renderIdolChips();
      showScreen('config-screen');
    }

    // --- アイドルプール管理 ---
    function renderIdolChips() {
      const container = document.getElementById('idolChipContainer');
      container.innerHTML = '';
      idolPool.forEach((name, idx) => {
        const chip = document.createElement('div');
        chip.className = 'idol-chip';
        chip.innerHTML = `<span>${name}</span><span class="del-btn" onclick="removeIdol(${idx})">×</span>`;
        container.appendChild(chip);
      });
    }

    function addIdol() {
      const input = document.getElementById('newIdolInput');
      const val = input.value.trim();
      if (val) {
        idolPool.push(val);
        input.value = '';
        renderIdolChips();
      }
    }

    function removeIdol(index) {
      if (idolPool.length <= 4) {
        alert("最低4組以上のアイドルが必要です。");
        return;
      }
      idolPool.splice(index, 1);
      renderIdolChips();
    }

    // --- ゲーム開始処理 ---
    function startGame() {
      playSound('start');

      // 設定取得
      const modeRadio = document.querySelector('input[name="gameMode"]:checked');
      gameState.mode = modeRadio ? modeRadio.value : 'turn';
      gameState.noDuplicate = document.getElementById('ruleNoDuplicate').checked;

      // ゲームデータ初期化
      gameState.p1Slots = Array(timeSlots.length).fill(null);
      gameState.p2Slots = Array(timeSlots.length).fill(null);
      gameState.currentPlayer = 1;
      gameState.currentIndexP1 = 0;
      gameState.currentIndexP2 = 0;
      gameState.isSpinning = false;

      renderBoards();
      updateStatusUI();
      showScreen('game-screen');
    }

    function renderBoards() {
      ['P1', 'P2'].forEach(playerKey => {
        const listEl = document.getElementById(`list${playerKey}`);
        listEl.innerHTML = '';
        const slotsData = playerKey === 'P1' ? gameState.p1Slots : gameState.p2Slots;

        timeSlots.forEach((timeStr, idx) => {
          const item = document.createElement('div');
          const filled = slotsData[idx] !== null;
          item.className = `slot-item ${filled ? 'filled' : ''}`;
          item.innerHTML = `
            <span class="slot-time">${timeStr}</span>
            <span class="slot-idol">${filled ? slotsData[idx] : '未定'}</span>
          `;
          listEl.appendChild(item);
        });
      });
    }

    function updateStatusUI() {
      const turnInd = document.getElementById('turnIndicator');
      const progInd = document.getElementById('slotProgress');
      const boardP1 = document.getElementById('boardP1');
      const boardP2 = document.getElementById('boardP2');

      turnInd.innerText = `PLAYER ${gameState.currentPlayer} の番です！`;

      boardP1.classList.toggle('active-player', gameState.currentPlayer === 1);
      boardP2.classList.toggle('active-player', gameState.currentPlayer === 2);

      const remP1 = timeSlots.length - gameState.currentIndexP1;
      const remP2 = timeSlots.length - gameState.currentIndexP2;
      progInd.innerText = `P1残り: ${remP1} / P2残り: ${remP2}`;
    }

    // --- スロット抽選ロジック ---
    function spinSlot() {
      if (gameState.isSpinning) return;

      // 現在のプレイヤーの残り枠チェック
      const isP1 = gameState.currentPlayer === 1;
      const curIdx = isP1 ? gameState.currentIndexP1 : gameState.currentIndexP2;
      if (curIdx >= timeSlots.length) return;

      gameState.isSpinning = true;
      const spinBtn = document.getElementById('spinBtn');
      const slotDisplay = document.getElementById('slotDisplay');
      spinBtn.disabled = true;
      slotDisplay.classList.add('spinning');

      let spinCount = 0;
      const maxSpin = 20;

      const timer = setInterval(() => {
        const randomIdol = idolPool[Math.floor(Math.random() * idolPool.length)];
        slotDisplay.innerText = randomIdol;
        playSound('spin');
        spinCount++;

        if (spinCount >= maxSpin) {
          clearInterval(timer);
          slotDisplay.classList.remove('spinning');

          // 重複チェックロジック
          let finalChoice = randomIdol;
          if (gameState.noDuplicate) {
            const usedInCurrent = isP1 ? gameState.p1Slots : gameState.p2Slots;
            const available = idolPool.filter(id => !usedInCurrent.includes(id));
            if (available.length > 0) {
              finalChoice = available[Math.floor(Math.random() * available.length)];
            }
          }

          slotDisplay.innerText = finalChoice;
          playSound('stop');

          // スロット枠にセット
          if (isP1) {
            gameState.p1Slots[gameState.currentIndexP1] = finalChoice;
            gameState.currentIndexP1++;
          } else {
            gameState.p2Slots[gameState.currentIndexP2] = finalChoice;
            gameState.currentIndexP2++;
          }

          renderBoards();

          // プレイヤー切り替え処理
          setTimeout(() => {
            checkNextTurn();
            spinBtn.disabled = false;
            gameState.isSpinning = false;
          }, 600);
        }
      }, 80);
    }

    function checkNextTurn() {
      const p1Done = gameState.currentIndexP1 >= timeSlots.length;
      const p2Done = gameState.currentIndexP2 >= timeSlots.length;

      if (p1Done && p2Done) {
        finishGame();
        return;
      }

      if (gameState.mode === 'turn') {
        // 交互モード
        if (gameState.currentPlayer === 1) {
          gameState.currentPlayer = p2Done ? 1 : 2;
        } else {
          gameState.currentPlayer = p1Done ? 2 : 1;
        }
      } else {
        // 1人連続モード (solo-first)
        if (gameState.currentPlayer === 1 && p1Done) {
          gameState.currentPlayer = 2;
        }
      }

      updateStatusUI();
    }

    // --- ゲーム終了・リザルト ---
    function finishGame() {
      playSound('start');
      showScreen('result-screen');

      const resultGrid = document.getElementById('resultGrid');
      resultGrid.innerHTML = `
        <div class="tt-board">
          <h3>PLAYER 1 タイムテーブル</h3>
          <div class="slot-list">
            ${timeSlots.map((t, i) => `
              <div class="slot-item filled">
                <span class="slot-time">${t}</span>
                <span class="slot-idol">${gameState.p1Slots[i]}</span>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="tt-board">
          <h3>PLAYER 2 タイムテーブル</h3>
          <div class="slot-list">
            ${timeSlots.map((t, i) => `
              <div class="slot-item filled">
                <span class="slot-time">${t}</span>
                <span class="slot-idol">${gameState.p2Slots[i]}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // --- 結果テキストコピー ---
    function copyResultText() {
      let txt = "【アイドル争奪フェス合戦 結果】\n\n";
      txt += "--- PLAYER 1 ---\n";
      timeSlots.forEach((t, i) => {
        txt += `${t}: ${gameState.p1Slots[i]}\n`;
      });
      txt += "\n--- PLAYER 2 ---\n";
      timeSlots.forEach((t, i) => {
        txt += `${t}: ${gameState.p2Slots[i]}\n`;
      });

      navigator.clipboard.writeText(txt).then(() => {
        alert("タイムテーブルをクリップボードにコピーしました！");
      });
    }

    // --- 結果画像保存 (簡易Canvas生成) ---
    function downloadResultImage() {
      const c = document.createElement('canvas');
      c.width = 800;
      c.height = 650;
      const context = c.getContext('2d');

      // 背景
      context.fillStyle = "#0a0a16";
      context.fillRect(0, 0, c.width, c.height);

      // タイトル
      context.fillStyle = "#ffe600";
      context.font = "bold 28px sans-serif";
      context.textAlign = "center";
      context.fillText("アイドル争奪フェス合戦 〜タイムテーブル〜", c.width / 2, 45);

      // 枠線とテキスト描写
      const drawPlayerTable = (title, slots, startX) => {
        context.fillStyle = "#00f0ff";
        context.font = "bold 20px sans-serif";
        context.fillText(title, startX + 170, 95);

        slots.forEach((s, i) => {
          const y = 130 + i * 60;
          context.fillStyle = "rgba(255,255,255,0.08)";
          context.fillRect(startX, y, 340, 50);

          context.fillStyle = "#aaaaaa";
          context.font = "14px sans-serif";
          context.textAlign = "left";
          context.fillText(timeSlots[i], startX + 15, y + 30);

          context.fillStyle = "#ffffff";
          context.font = "bold 16px sans-serif";
          context.textAlign = "right";
          context.fillText(s, startX + 320, y + 30);
        });
      };

      drawPlayerTable("PLAYER 1", gameState.p1Slots, 40);
      drawPlayerTable("PLAYER 2", gameState.p2Slots, 420);

      // 保存処理
      const link = document.createElement('a');
      link.download = 'timetable.png';
      link.href = c.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
